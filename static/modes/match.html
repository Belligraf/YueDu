<div id="match-mode" class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">🔗 Сопоставление слов</h2>
            <p class="text-sm text-gray-500 mt-1">Выберите слова с обеих сторон и нажмите «Привязать»</p>
        </div>
        <div class="flex gap-3">
            <button onclick="showTab('parallel')"
                class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600">
                📖 Вернуться в параллельный
            </button>
            <button onclick="saveToLibrary()"
                class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                💾 Сохранить
            </button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-8">
        <div>
            <h3 class="font-bold text-lg mb-3">📖 Китайские слова:</h3>
            <div id="match-original" class="bg-white p-6 rounded-xl shadow-lg leading-loose text-xl min-h-[500px] preserve-whitespace"></div>
        </div>
        <div>
            <h3 class="font-bold text-lg mb-3">🌍 Фразы перевода:</h3>
            <div id="match-translation" class="bg-white p-6 rounded-xl shadow-lg leading-loose text-lg min-h-[500px] preserve-whitespace"></div>
        </div>
    </div>
</div>
