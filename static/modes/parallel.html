<div id="parallel-mode" class="max-w-7xl mx-auto p-6">
  <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">📖 Параллельный ридер</h1>

  <!-- Форма ввода (для новых текстов) -->
  <div id="parallel-input-section">
    <div class="grid grid-cols-2 gap-8">
      <div>
        <label class="block text-sm font-semibold mb-3 text-gray-700">📖 Оригинальный текст (китайский)</label>
        <textarea id="parallel-original-input" rows="14"
          class="w-full p-6 border border-gray-300 rounded-3xl text-xl font-medium focus:outline-none focus:border-blue-400 resize-y min-h-[420px]"
          placeholder="Вставьте сюда китайский текст..."></textarea>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-3 text-gray-700">🌍 Перевод (русский)</label>
        <textarea id="parallel-translation-input" rows="14"
          class="w-full p-6 border border-gray-300 rounded-3xl text-xl font-medium focus:outline-none focus:border-blue-400 resize-y min-h-[420px]"
          placeholder="Вставьте сюда перевод на русский..."></textarea>
      </div>
    </div>

    <div class="flex justify-center gap-6 mt-10">
      <button onclick="window.startParallelReading()"
              class="px-10 py-5 bg-blue-600 hover:bg-blue-700 text-white text-2xl font-semibold rounded-3xl flex items-center gap-4 shadow-lg transition-all">
        📖 Читать
      </button>
      <button onclick="window.saveParallelToLibrary()"
              class="px-10 py-5 bg-emerald-600 hover:bg-emerald-700 text-white text-2xl font-semibold rounded-3xl flex items-center gap-4 shadow-lg transition-all">
        💾 Сохранить в библиотеку
      </button>
    </div>
  </div>

  <!-- Режим чтения -->
  <div id="parallel-reading-section" class="hidden">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800"></h2>
      <div class="flex items-center gap-4">
        <button onclick="window.toggleParallelBlur()" id="parallel-blur-btn"
                class="px-6 py-3 bg-gray-200 hover:bg-gray-300 rounded-2xl font-medium flex items-center gap-2">
          🙈 Скрыть перевод
        </button>
        <button onclick="window.restartParallelInput()"
                class="px-6 py-3 bg-gray-600 text-white hover:bg-gray-700 rounded-2xl font-medium">
          ← Новая пара
        </button>
        <button onclick="window.saveParallelToLibrary()"
                class="px-6 py-3 bg-emerald-600 text-white hover:bg-emerald-700 rounded-2xl font-medium">
          💾 Сохранить
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-8">
      <div>
        <h3 class="font-bold text-lg mb-3">📖 Оригинал <span class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full">ПКМ по слову → перевод</span></h3>
        <div id="parallel-original-reading" class="bg-white p-8 rounded-3xl shadow-xl leading-relaxed text-2xl min-h-[520px] whitespace-pre-wrap"></div>
      </div>
      <div>
        <h3 class="font-bold text-lg mb-3">🌍 Перевод</h3>
        <div id="parallel-translation-reading" class="bg-white p-8 rounded-3xl shadow-xl leading-relaxed text-xl min-h-[520px] whitespace-pre-wrap"></div>
      </div>
    </div>
  </div>
</div>
