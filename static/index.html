<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YueDu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-gray-50">

    <!-- ВКЛАДКИ -->
    <div class="max-w-7xl mx-auto pt-6 px-6">
        <div class="flex gap-4 mb-6">
            <button id="tab-simple-btn" onclick="showTab('simple')"
                class="tab-btn px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 font-semibold tab-active">
                📝 Простой ридер
            </button>
            <button id="tab-parallel-btn" onclick="showTab('parallel')"
                class="tab-btn px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 font-semibold">
                📖 Параллельный ридер
            </button>
            <button id="tab-match-btn" onclick="showTab('match')"
                class="tab-btn px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 font-semibold">
                🔗 Сопоставить слова
            </button>
        </div>
    </div>

    <!-- КОНТЕНТ ВКЛАДОК -->
    <div id="content-container"></div>

    <!-- БИБЛИОТЕКА СПРАВА -->
    <div class="fixed right-0 top-0 h-full z-40 transition-all duration-300" id="library-panel-container">
        <button onclick="window.toggleLibraryPanel()"
                class="absolute -left-10 top-6 bg-white shadow-lg rounded-l-2xl px-3 py-6 text-xl hover:bg-gray-100 border border-r-0 border-gray-200 flex items-center justify-center w-10 h-12 z-50">
            📚
        </button>

        <div id="libraryPanel" class="h-full w-72 bg-white shadow-2xl flex flex-col border-l border-gray-200 overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                    📚 Моя библиотека
                </h3>
                <button onclick="window.toggleLibraryPanel()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
            </div>

            <div class="p-3 border-b">
                <button onclick="loadLibrary()"
                        class="w-full text-left text-blue-600 hover:text-blue-700 text-sm flex items-center gap-1">
                    🔄 Обновить список
                </button>
            </div>

            <div id="libraryList" class="flex-1 overflow-y-auto p-3 space-y-2 custom-scroll">
                <!-- сюда загружаются тексты -->
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ТЕКСТА (одно на всё приложение) -->
    <div id="editTextModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[110]">
        <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full mx-4 overflow-hidden">
            <div class="p-6">
                <h3 class="text-2xl font-bold mb-6 flex items-center gap-3">
                    ✏️ Редактирование текста
                    <span id="edit-modal-id" class="text-xs bg-gray-100 px-3 py-1 rounded-full font-mono"></span>
                </h3>

                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Название текста</label>
                        <input id="edit-title" type="text"
                               class="w-full p-4 border border-gray-300 rounded-2xl text-lg focus:outline-none focus:border-blue-400">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">📖 Оригинальный текст (китайский)</label>
                        <textarea id="edit-original" rows="8"
                                  class="w-full p-4 border border-gray-300 rounded-3xl text-xl font-medium resize-y focus:outline-none focus:border-blue-400"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">🌍 Перевод (русский)</label>
                        <textarea id="edit-translation" rows="8"
                                  class="w-full p-4 border border-gray-300 rounded-3xl text-xl font-medium resize-y focus:outline-none focus:border-blue-400"></textarea>
                    </div>
                </div>
            </div>

            <div class="border-t px-6 py-5 flex gap-3">
                <button onclick="window.saveEditedText()"
                        class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-2xl flex items-center justify-center gap-2">
                    💾 Сохранить изменения
                </button>
                <button onclick="window.closeEditModal()"
                        class="flex-1 py-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl">
                    Отмена
                </button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ВЫБОРА РЕЖИМА (оставлено без изменений) -->
    <div id="modeSelectorModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[100]">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 overflow-hidden">
            <div class="p-6">
                <h3 class="text-xl font-bold text-center mb-6">Выберите режим работы</h3>
                <div class="space-y-3">
                    <button onclick="openInReader()" class="w-full py-4 px-6 text-left rounded-xl hover:bg-gray-50 flex items-center gap-4 border border-gray-200 hover:border-blue-300 transition-all">
                        <div class="text-3xl">📖</div>
                        <div>
                            <div class="font-semibold">Ридер</div>
                            <div class="text-sm text-gray-500">Простое чтение с переводом слов по клику</div>
                        </div>
                    </button>
                    <button onclick="openInParallel()" class="w-full py-4 px-6 text-left rounded-xl hover:bg-gray-50 flex items-center gap-4 border border-gray-200 hover:border-blue-300 transition-all">
                        <div class="text-3xl">📜</div>
                        <div>
                            <div class="font-semibold">Параллельный ридер</div>
                            <div class="text-sm text-gray-500">Оригинал + перевод с блюром</div>
                        </div>
                    </button>
                    <button onclick="openInMatch()" class="w-full py-4 px-6 text-left rounded-xl hover:bg-gray-50 flex items-center gap-4 border border-gray-200 hover:border-blue-300 transition-all">
                        <div class="text-3xl">🔗</div>
                        <div>
                            <div class="font-semibold">Сопоставить слова</div>
                            <div class="text-sm text-gray-500">Связывание слов и переводов</div>
                        </div>
                    </button>
                </div>
            </div>
            <div class="border-t p-4">
                <button onclick="closeModeSelector()" class="w-full py-3 text-gray-500 hover:text-gray-700 font-medium">Отмена</button>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="/static/js/renderer.js"></script>
    <script src="/static/js/core.js"></script>
    <script src="/static/js/popup.js"></script>
    <script src="/static/js/modes.js"></script>

    <!-- Modes -->
    <script src="/static/js/modes/parallel.js"></script>
    <script src="/static/js/modes/matches.js"></script>
    <script src="/static/js/modes/reader.js"></script>

    <script src="/static/js/library.js"></script>

    <script>
document.addEventListener('DOMContentLoaded', async () => {
        console.log("🚀 YueDu инициализация...");

        // Правильный запуск через showTab
        if (typeof window.showTab === 'function') {
            await window.showTab('simple');
            console.log("✅ Открыта вкладка 'simple'");
        } else {
            console.error("❌ window.showTab не найдена! Проверь порядок скриптов.");
        }

        // Загружаем библиотеку
        if (typeof window.loadLibrary === 'function') {
            window.loadLibrary();
        } else {
            console.error("❌ loadLibrary не найдена");
        }

        console.log("✅ YueDu полностью запущен");
    });
    setTimeout(() => {
        window.loadLibrary();
        const libPanel = document.getElementById('library-panel-container');
        if (libPanel) libPanel.style.right = '0px';
        window.formatAllText();
    }, 500);
    </script>
</body>
</html>
