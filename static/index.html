<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YueDu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-gray-50">

    <!-- ВКЛАДКИ -->
    <div class="max-w-7xl mx-auto pt-6 px-6">
        <div class="flex gap-4 mb-6">
            <button id="tab-simple-btn" onclick="showTab('simple')"
                class="tab-btn px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 font-semibold tab-active">
                📝 Простой ридер
            </button>
            <button id="tab-parallel-btn" onclick="showTab('parallel')"
                class="tab-btn px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 font-semibold">
                📖 Параллельный ридер
            </button>
            <button id="tab-match-btn" onclick="showTab('match')"
                class="tab-btn px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 font-semibold">
                🔗 Сопоставить слова
            </button>
        </div>
    </div>

    <!-- КОНТЕНТ ВКЛАДОК -->
    <div id="content-container"></div>

    <!-- БИБЛИОТЕКА СПРАВА -->
    <div class="fixed right-0 top-0 h-full w-64 bg-white shadow-xl z-40 overflow-y-auto" id="libraryPanel">
        <div class="p-4 border-b">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-gray-800">📚 Моя библиотека</h3>
                <button onclick="loadLibrary()" class="text-blue-500 text-sm">🔄 Обновить</button>
            </div>
            <p class="text-xs text-gray-500 mt-1">Кликни для загрузки</p>
        </div>
        <div id="libraryList" class="overflow-y-auto h-[calc(100%-80px)] p-3 space-y-2">
            <div class="text-gray-500 text-center p-4">Загрузка...</div>
        </div>
    </div>

    <!-- ПОПАП -->
    <div id="popup" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <!-- заполняется JS -->
    </div>

    <!-- JS -->
    <script src="/static/js/core.js"></script>
    <script src="/static/js/popup.js"></script>
    <script src="/static/js/matches.js"></script>
    <script src="/static/js/modes.js"></script>
    <script src="/static/js/library.js"></script>

    <script>
    async function loadTabContent(tabName) {
        const container = document.getElementById('content-container');
        const res = await fetch(`/static/modes/${tabName}.html`);
        const html = await res.text();
        container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await loadTabContent('simple');
        loadLibrary();
        console.log("✅ YueDu — старый дизайн загружен");
    });
    </script>
<!-- МОДАЛЬНОЕ ОКНО ВЫБОРА РЕЖИМА -->
<div id="modeSelectorModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[100]">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 overflow-hidden">
        <div class="p-6">
            <h3 class="text-xl font-bold text-center mb-6">Выберите режим работы</h3>

            <div class="space-y-3">
                <button onclick="openInReader()"
                    class="w-full py-4 px-6 text-left rounded-xl hover:bg-gray-50 flex items-center gap-4 border border-gray-200 hover:border-blue-300 transition-all">
                    <div class="text-3xl">📖</div>
                    <div>
                        <div class="font-semibold">Ридер</div>
                        <div class="text-sm text-gray-500">Простое чтение с переводом слов по клику</div>
                    </div>
                </button>

                <button onclick="openInParallel()"
                    class="w-full py-4 px-6 text-left rounded-xl hover:bg-gray-50 flex items-center gap-4 border border-gray-200 hover:border-blue-300 transition-all">
                    <div class="text-3xl">📜</div>
                    <div>
                        <div class="font-semibold">Параллельный ридер</div>
                        <div class="text-sm text-gray-500">Оригинал + перевод с блюром</div>
                    </div>
                </button>

                <button onclick="openInMatch()"
                    class="w-full py-4 px-6 text-left rounded-xl hover:bg-gray-50 flex items-center gap-4 border border-gray-200 hover:border-blue-300 transition-all">
                    <div class="text-3xl">🔗</div>
                    <div>
                        <div class="font-semibold">Сопоставить слова</div>
                        <div class="text-sm text-gray-500">Связывание слов и переводов</div>
                    </div>
                </button>
            </div>
        </div>

        <div class="border-t p-4">
            <button onclick="closeModeSelector()"
                class="w-full py-3 text-gray-500 hover:text-gray-700 font-medium">
                Отмена
            </button>
        </div>
    </div>
</div>
</body>
</html>
